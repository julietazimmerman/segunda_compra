# Parámetros de la matriz.
# Los journeys y campañas a analizar se definen en tests.csv (raíz del proyecto):
#   una fila por campaña; 'Test' agrupa las variantes que se comparan y 'Mensaje' es el nombre de cada una.
#   Después de reemplazar el CSV: python fetch_data.py --check
settings:
  min_delivered: 100    # segmentos con menos impresiones totales no se muestran
